<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чек-лист: как завершить СОУТ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #e9eff5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      max-width: 700px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      padding: 32px 36px 36px;
      box-shadow: 0 20px 60px rgba(0,30,60,0.12);
      position: relative;
    }

    /* Кнопка печати */
    .print-btn {
      position: absolute;
      top: 20px;
      right: 24px;
      background: #e6edf5;
      border: none;
      border-radius: 40px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #003366;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .print-btn:hover {
      background: #d0ddee;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #003366;
      border-bottom: 3px solid #e6f0fa;
      padding-bottom: 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sub {
      font-size: 15px;
      color: #1a3a5f;
      background: #f0f7fe;
      padding: 10px 16px;
      border-radius: 12px;
      border-left: 5px solid #2b7bb6;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #eef4fa;
    }
    .checklist-item:last-child {
      border-bottom: none;
    }
    .checklist-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin-top: 2px;
      accent-color: #003366;
      flex-shrink: 0;
      cursor: pointer;
    }
    .checklist-item label {
      font-size: 16px;
      line-height: 1.5;
      color: #152b3d;
      cursor: pointer;
    }
    .checklist-item label strong {
      color: #003366;
    }
    .checklist-item.done label {
      text-decoration: line-through;
      color: #6f8aa8;
    }
    .progress {
      background: #e6edf5;
      border-radius: 40px;
      height: 8px;
      margin: 18px 0 10px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: #003366;
      width: 0%;
      transition: width 0.3s;
    }
    .progress-text {
      text-align: right;
      font-size: 14px;
      font-weight: 600;
      color: #003366;
      margin-bottom: 6px;
    }
    .contacts {
      margin-top: 28px;
      padding: 16px 20px;
      background: #f8faff;
      border-radius: 16px;
      border: 1px solid #dde8f2;
      text-align: center;
    }
    .contacts p {
      font-size: 15px;
      font-weight: 600;
      color: #003366;
      margin-bottom: 6px;
    }
    .contacts a {
      color: #003366;
      text-decoration: none;
      font-weight: 500;
    }
    .contacts a:hover {
      text-decoration: underline;
    }
    .footer-note {
      margin-top: 20px;
      font-size: 13px;
      color: #557a9a;
      text-align: center;
      border-top: 1px solid #e6edf5;
      padding-top: 16px;
    }

    @media print {
      body { background: #fff; padding: 0.2in; }
      .card { box-shadow: none; border: 1px solid #ccc; border-radius: 12px; padding: 24px; }
      .print-btn { display: none !important; }
      .checklist-item input[type="checkbox"] { accent-color: #003366; }
    }

    @media (max-width: 500px) {
      .card { padding: 20px; }
      h1 { font-size: 20px; }
      .checklist-item label { font-size: 15px; }
      .print-btn { top: 14px; right: 16px; font-size: 12px; padding: 4px 12px; }
    }
  </style>
</head>
<body>
<div class="card">

  <!-- КНОПКА ПЕЧАТИ -->
  <button class="print-btn" onclick="window.print()">🖨️ Печать</button>

  <h1>📋 Чек-лист: как завершить СОУТ</h1>
  <div class="sub">
    ✅ Отмечайте прогресс завершения СОУТ
  </div>

  <div id="checklistContainer">
    <div class="checklist-item">
      <input type="checkbox" id="chk1">
      <label for="chk1"><strong>Утвердить</strong> отчёт о проведении СОУТ</label>
    </div>
    <div class="checklist-item">
      <input type="checkbox" id="chk2">
      <label for="chk2"><strong>Подписать титульный лист</strong> и направить исполнителю на электронную почту для выгрузки <strong>во ФГИС СОУТ</strong> (в течение 3 рабочих дней)</label>
    </div>
    <div class="checklist-item">
      <input type="checkbox" id="chk3">
      <label for="chk3">Подать <strong>декларацию соответствия</strong> (если установлен 1 или 2 класс условий труда)</label>
    </div>
    <div class="checklist-item">
      <input type="checkbox" id="chk4">
      <label for="chk4"><strong>Ознакомить</strong> каждого сотрудника с картой СОУТ под подпись (в течение 30 календарных дней)</label>
    </div>
    <div class="checklist-item">
      <input type="checkbox" id="chk5">
      <label for="chk5">Опубликовать <strong>сводную ведомость</strong> на сайте организации (при наличии сайта)</label>
    </div>
  </div>

  <div class="progress-text" id="progressText">0 / 5</div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

  <!-- Контакты -->
  <div class="contacts">
    <p>📞 По всем вопросам, связанным с СОУТ, обращайтесь:</p>
    <div>
      ☎️ <a href="tel:+78129881640">+7 (812) 988-16-40</a> &nbsp;|&nbsp;
      ✉️ <a href="mailto:ot@trud-ps.ru">ot@trud-ps.ru</a>
    </div>
  </div>

  <div class="footer-note">
    💡 Данный чек-лист сохраняется в браузере, данные остаются только у Вас и помогают завершить процедуру оценки мест.
  </div>
</div>

<script>
  (function() {
    const checkboxes = document.querySelectorAll('#checklistContainer input[type="checkbox"]');
    const progressText = document.getElementById('progressText');
    const progressBar = document.getElementById('progressBar');

    function updateProgress() {
      const total = checkboxes.length;
      const checked = document.querySelectorAll('#checklistContainer input[type="checkbox"]:checked').length;
      progressText.textContent = `${checked} / ${total}`;
      const percent = (checked / total) * 100;
      progressBar.style.width = percent + '%';

      checkboxes.forEach(cb => {
        const item = cb.closest('.checklist-item');
        if (cb.checked) {
          item.classList.add('done');
        } else {
          item.classList.remove('done');
        }
      });

      const states = Array.from(checkboxes).map(cb => cb.checked);
      localStorage.setItem('sout_checklist_states', JSON.stringify(states));
    }

    function loadState() {
      const saved = localStorage.getItem('sout_checklist_states');
      if (saved) {
        const states = JSON.parse(saved);
        checkboxes.forEach((cb, index) => {
          if (states[index]) {
            cb.checked = true;
          } else {
            cb.checked = false;
          }
        });
        updateProgress();
      }
    }

    checkboxes.forEach(cb => {
      cb.addEventListener('change', updateProgress);
    });

    loadState();
  })();
</script>

</body>
</html>
